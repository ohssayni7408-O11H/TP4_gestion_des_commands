<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP4 - Gestion des commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-4">

    <h1 class="mb-4">Gestion des commandes</h1>

    <div id="error-zone" class="alert alert-danger d-none" role="alert"></div>

    <div id="indicators" class="row g-3 mb-4"></div>

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <input type="text" id="search-input" class="form-control"
               placeholder="Rechercher par nom de client...">
      </div>
      <div class="col-6 col-md-4">
        <select id="status-filter" class="form-select">
          <option value="">Tous les statuts</option>
          <option value="Livree">Livree</option>
          <option value="En attente">En attente</option>
          <option value="Annulee">Annulee</option>
        </select>
      </div>
      <div class="col-6 col-md-4">
        <select id="category-filter" class="form-select">
          <option value="">Toutes les catégories</option>
        </select>
      </div>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Client</th>
            <th>Date</th>
            <th>Statut</th>
            <th>Total</th>
            <th>Détail</th>
          </tr>
        </thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>

  </div>

  <div class="modal fade" id="order-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="order-modal-title">Détail de la commande</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="order-modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
